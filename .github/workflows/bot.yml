def sell(key, st, price, reason):
    bal = st["coin"] * price * (1 - FEE)
    pnl = (bal / st["cost"] - 1) * 100
    notify(f"{reason} {key} at {price:.6g} | balance {bal:.2f} | P&L {pnl:+.2f}%")
    log_trade(key, reason, price, bal, f"{pnl:.2f}")
    st["bal"], st["coin"], st["entry"], st["cost"] = bal, 0.0, None, None


